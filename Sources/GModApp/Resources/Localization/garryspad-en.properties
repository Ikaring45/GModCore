garryspad.options.game.touch-actions-detail=FIRE, ALT, USE, RELOAD, DUCK, and SPEED publish Source input bits to the canonical Player; the SERVER active-weapon controller runs the original SWEP callbacks. SPEED also retains Source FullNoClipMove's half-speed modifier. PREV and NEXT use the original SWEP Slot order and CLIENT use command. DROP invokes Player:DropWeapon for the active full-EHANDLE Weapon. UNDO uses the original undo.lua path. NOCLIP queues the original Sandbox PlayerNoClip permission hook before changing the canonical move type.
