garryspad.options.game.touch-actions-detail=攻撃・副攻撃・使う・リロード・しゃがむ・加速はSource入力ビットとして正規のPlayer状態へ渡り、SERVERのアクティブ武器制御が原版SWEPコールバックを実行します。加速はSource FullNoClipMove本来の半速修飾も維持します。前武器・次武器は原版SWEPのSlot順とCLIENTのuseコマンドを使います。「捨てる」は現在の完全EHANDLE武器へPlayer:DropWeaponを実行し、「戻す」は原版undo.lua経路を使います。「ノークリップ」は原版SandboxのPlayerNoClip許可フックを通してから正規の移動種別を変更します。
garryspad.options.legal.title=法的情報
garryspad.options.legal.detail=Garry's PADは所有者が「ファイル」から選択したコンテンツを読み込みます。Garry's ModおよびSourceのアセットに関する権利は各権利者に帰属し、このアプリがコンテンツのライセンスを付与するものではありません。
garryspad.options.unavailable.game=公式ゲームConVarは、検証済みのホスト操作へまだ接続されていません。代替の値を表示・保存することはありません。
garryspad.options.unavailable.keyboard=ハードウェアキー割り当てと公式bindコマンドはまだ接続されていません。現在の入力経路はタッチ操作です。
garryspad.options.unavailable.mouse=公式マウスConVarは未接続です。上の設定はGarry's PADのタッチ視点操作だけに適用されます。
garryspad.options.unavailable.video=公式SourceビデオConVar、解像度モード、レンダラー品質切替は未接続です。
garryspad.options.unavailable.voice=音声入力と公式ボイスシステムはまだ接続されていません。
